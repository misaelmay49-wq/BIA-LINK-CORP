<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIA LINK - {{_('Producto Registrado') }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: #0F172A;
            padding: 25px 20px;
        }
        .logo {
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo svg {
            width: 24px;
            height: 24px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            color: #94A3B8;
            text-decoration: none;
            cursor: pointer;
        }
        .menu-item:hover {
            background: #1F2937;
        }
        .menu-item.active {
            background: #2563EB;
            color: white;
        }
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        .card {
            background: #1E3A8A;
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
        }
        .card-logo {
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 25px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-logo svg {
            width: 22px;
            height: 22px;
        }
        .check {
            width: 60px;
            height: 60px;
            border: 3px solid #22C55E;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #22C55E;
        }
        h2 { color: #22C55E; margin-bottom: 15px; }
        p { color: #94A3B8; margin-bottom: 30px; }
        a.boton {
            display: block;
            width: 100%;
            padding: 14px;
            background: #2563EB;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        a.boton:hover { background: #1D4ED8; }
        
 body {
    position: relative;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    min-height: 100vh;
    width: 100%;
    padding-top: 62px;
    margin: 0;
    background: #0f172a;
}

.adsterra-banner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin: 0;
    padding: 0;
    z-index: 2;
}

.adsterra-banner iframe {
    display: block;
    max-width: 100%;
    border: 0;
}

.content {
    flex: 1;
    min-width: 0;
    width: 100%;
}

@media (min-width: 800px) {
    body {
        padding-top: 102px;
    }

    .adsterra-banner {
        height: 90px;
    }
}

    </style>
</head>
 <body>
  <div id="adsterra-container" class="adsterra-banner"></div>
     <div class="content">
        <div class="card">
            <div class="card-logo">
                BIA LINK
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="16" width="4" height="5" fill="white" opacity="0.8"/>
                    <rect x="10" y="13" width="4" height="8" fill="white" opacity="0.8"/>
                    <rect x="17" y="10" width="4" height="11" fill="white" opacity="0.8"/>
                    <path d="M3 16L10 13L17 9L21 5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M17 5H21V9" stroke="white" heake-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="check">✓</div>
            <h2>✅📦 {{_('Producto registrado correctamente') }}</h2>
            <p>{{_('El producto se ha guardado exitosamente en el sistema.') }}</p>
            <a href="/" class="boton">← {{_('Volver al inicio') }}</a>
        </div>
    </div>
     <script>
document.addEventListener("DOMContentLoaded", function () {

    const contenedor = document.getElementById("adsterra-container");

    if (!contenedor) return;

    let tipoActual = "";

    function cargarAnuncio() {

        const esMovil = window.innerWidth < 800;
        const nuevoTipo = esMovil ? "mobile" : "desktop";

        if (tipoActual === nuevoTipo) return;

        tipoActual = nuevoTipo;
        contenedor.innerHTML = "";

        const opciones = document.createElement("script");

        if (esMovil) {

            window.atOptions = {
                'key': 'd403194eb025d69cbaea4103c06945e1',
                'format': 'iframe',
                'height': 50,
                'width': 320,
                'params': {}
            };

            opciones.src =
                "https://bauval.org/22/d403194eb025d69cbaea4103c06945e1";

        } else {

            window.atOptions = {
                'key': 'b522c9ccd25d9d4d548be4dcf97e183d',
                'format': 'iframe',
                'height': 90,
                'width': 728,
                'params': {}
            };

            opciones.src =
                "https://bauval.org/22/b522c9ccd25d9d4d548be4dcf97e183d";
        }

        contenedor.appendChild(opciones);
    }

    cargarAnuncio();

    window.addEventListener("resize", cargarAnuncio);

});
         
 </script>
</body>
</html>
